<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,700,100,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .hero{font-family:'Fraunces',Georgia,serif;font-weight:700;font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1;font-size:56px;letter-spacing:-1.5px;line-height:1;background:var(--cac-grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .h2-display{font-family:'Fraunces',Georgia,serif;font-weight:700;font-variation-settings:'opsz' 96,'SOFT' 100,'WONK' 1;font-size:28px;letter-spacing:-0.5px;line-height:1.1}
  .body{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:400;color:var(--cac-text-dim);line-height:1.45;font-style:italic;max-width:560px}
  .row{display:flex;align-items:baseline;gap:10px}
  .lbl{font-size:10px;color:var(--cac-text-muted);letter-spacing:1px;text-transform:uppercase;font-family:var(--cac-font-sans)}
</style></head>
<body><div class="card">
  <div class="row"><span class="hero">Something old</span><span class="lbl">Fraunces · 56 / wonk</span></div>
  <div class="row"><span class="h2-display">watches from the canopy.</span><span class="lbl">Fraunces · 28</span></div>
  <div class="body">Shady oaks, bold squirrels, muddy paws. The cats are serious about very silly things.</div>
</div></body></html>
