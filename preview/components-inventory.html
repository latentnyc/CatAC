<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:6px}
  .item{background:#242836;border:1.5px solid #2e3343;border-radius:6px;padding:6px 10px;cursor:pointer}
  .item.c{border-color:#B8B8B8}
  .item.r{border-color:#4AA3FF}
  .item.e{border-color:#B04AFF}
  .item.l{border-color:#FFB347;box-shadow:0 0 12px rgba(255,179,71,.25)}
  .t{font-size:9px;color:#70748a;text-transform:uppercase;letter-spacing:.8px}
  .n{font-weight:600;margin:2px 0;font-size:13px}
  .item.c .n{color:#B8B8B8}
  .item.r .n{color:#4AA3FF}
  .item.e .n{color:#B04AFF}
  .item.l .n{color:#FFB347}
  .b{font-size:11px;color:#a0a4b4}
  .flag{font-size:9px;color:#4caf7d;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
</style></head>
<body><div class="card">
  <div class="item r"><div class="t">Toy · 🌊</div><div class="n">Fine Feather of the Sage</div><div class="b">+2 INT · +1 WIS</div></div>
  <div class="item e"><div class="t">Relic · 🌆</div><div class="n">Enchanted Amulet of Whispers</div><div class="b">+3 DEX · +2 CHA</div><div class="flag">Equipped</div></div>
  <div class="item l"><div class="t">Treat · 🔥</div><div class="n">Mythic Catnip of Pouncing</div><div class="b">+4 STR · +2 DEX</div></div>
</div></body></html>
