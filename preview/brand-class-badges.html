<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:20px 22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .r{display:flex;flex-direction:column;align-items:center;gap:4px}
  .badge{width:40px;height:40px;border-radius:50%;background:#2a2a33;display:flex;align-items:center;justify-content:center;font-family:ui-serif,Georgia,serif;font-size:20px;font-weight:700;color:#ffd866;border:1px solid #3a4057}
  .n{font-size:10px;color:#70748a;text-transform:uppercase;letter-spacing:.5px}
  .l{font-size:11px;color:#a0a4b4}
</style></head>
<body><div class="card">
  <div class="r"><div class="badge">⚔</div><div class="l">Scrapper</div><div class="n">fighter</div></div>
  <div class="r"><div class="badge">✿</div><div class="l">Mystic</div><div class="n">mage</div></div>
  <div class="r"><div class="badge">✶</div><div class="l">Prowler</div><div class="n">rogue</div></div>
  <div class="r"><div class="badge">✚</div><div class="l">Purrist</div><div class="n">cleric</div></div>
</div></body></html>
