<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans);font-size:14px}
  .card{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:#242836;border:1.5px solid #2e3343;border-radius:8px;padding:10px 14px;min-width:110px}
  .tab.p{border-color:#6fb86b;background:color-mix(in srgb,#6fb86b 18%,#242836)}
  .tab.l{border-color:#57a8d3;background:color-mix(in srgb,#57a8d3 18%,#242836)}
  .tab.r{border-color:#b89ce8;background:color-mix(in srgb,#b89ce8 18%,#242836)}
  .tab.b{border-color:#e89660;background:color-mix(in srgb,#e89660 18%,#242836)}
  .ic{font-size:20px}
  .nm{font-size:11px;font-weight:600}
  .hx{font-size:10px;color:#70748a;font-variant-numeric:tabular-nums;letter-spacing:.4px}
</style></head>
<body><div class="card">
  <div class="row">
    <div class="tab p"><div class="ic">🌳</div><div class="nm">The Park</div><div class="hx">#6FB86B · earth</div></div>
    <div class="tab l"><div class="ic">🌊</div><div class="nm">The Lake</div><div class="hx">#57A8D3 · water</div></div>
    <div class="tab r"><div class="ic">🌆</div><div class="nm">Rooftops</div><div class="hx">#B89CE8 · air</div></div>
    <div class="tab b"><div class="ic">🔥</div><div class="nm">Bakery</div><div class="hx">#E89660 · fire</div></div>
  </div>
</div></body></html>
