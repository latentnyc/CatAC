<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:20px 22px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .r{display:flex;flex-direction:column;gap:4px;align-items:center}
  .box{width:72px;height:56px;background:#242836;border:1px solid #3a4057}
  .n{font-size:10px;color:#70748a;text-transform:uppercase;letter-spacing:.5px;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="card">
  <div class="r"><div class="box" style="border-radius:4px"></div><div class="n">xs · 4</div></div>
  <div class="r"><div class="box" style="border-radius:5px"></div><div class="n">sm · 5</div></div>
  <div class="r"><div class="box" style="border-radius:6px"></div><div class="n">md · 6</div></div>
  <div class="r"><div class="box" style="border-radius:8px"></div><div class="n">lg · 8</div></div>
  <div class="r"><div class="box" style="border-radius:10px"></div><div class="n">xl · 10</div></div>
  <div class="r"><div class="box" style="border-radius:12px"></div><div class="n">pill · 12</div></div>
</div></body></html>
