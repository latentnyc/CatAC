<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:8px}
  .toast{min-width:280px;max-width:320px;background:#1c1f29;border:1.5px solid #3a4057;border-radius:8px;padding:10px 12px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.crit{border-color:#82e0a1}.toast.crit .o{color:#82e0a1}
  .toast.fail{border-color:#d96c6c}.toast.fail .o{color:#d96c6c}
  .toast.success{border-color:#4caf7d}.toast.success .o{color:#4caf7d}
  .h{display:flex;justify-content:space-between;margin-bottom:4px}
  .o{font-weight:700;font-size:11px;letter-spacing:.8px}
  .z{font-size:11px;color:#a0a4b4}
  .b{font-weight:600;color:#e6e6ea;margin-bottom:3px}
  .rw{color:#ffd866;font-weight:600}
  .hz{color:#d96c6c;font-size:11px;margin-top:3px;font-style:italic}
</style></head>
<body><div class="card">
  <div class="toast crit"><div class="h"><span class="o">⭐ CRIT</span><span class="z">🌊 T3 The Lake</span></div><div class="b">Whiskers, Luna, Mochi</div><div class="rw">+85💰 · +2🐟 · +3 loot</div></div>
  <div class="toast fail"><div class="h"><span class="o">⚠️ FAIL</span><span class="z">🔥 T4 The Bakery</span></div><div class="b">Shadow, Pepper</div><div class="rw">+12💰</div><div class="hz">The Head Cook (+10) overwhelmed them.</div></div>
</div></body></html>
