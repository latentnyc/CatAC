<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .bar{display:flex;align-items:center;gap:10px}
  .lbl{font-size:11px;color:#a0a4b4;min-width:92px}
  .xp{flex:1;height:6px;background:#15171f;border:1px solid #222632;border-radius:3px;overflow:hidden}
  .xpf{height:100%;background:linear-gradient(90deg,#6fc38a,#a8dc6f)}
  .active{flex:1;height:8px;background:#15171f;border:1px solid #222632;border-radius:4px;overflow:hidden}
  .af{height:100%;background:linear-gradient(90deg,#c9a94a,#ffd866)}
  .num{font-variant-numeric:tabular-nums;color:#ffd866;font-size:12px;font-weight:700;min-width:58px;text-align:right}
</style></head>
<body><div class="card">
  <div class="bar"><span class="lbl">XP · Lv 12</span><div class="xp"><div class="xpf" style="width:68%"></div></div><span class="num">612 / 900</span></div>
  <div class="bar"><span class="lbl">Mission T3</span><div class="active"><div class="af" style="width:42%"></div></div><span class="num">5m 48s</span></div>
</div></body></html>
