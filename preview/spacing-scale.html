<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans);font-size:14px}
  .card{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px}
  .tick{height:8px;background:#12141c;border:1px solid #222632;border-radius:4px;flex:1}
  .lbl{font-size:10px;color:#70748a;text-transform:uppercase;letter-spacing:.8px;min-width:70px}
  .val{font-size:11px;color:#a0a4b4;font-variant-numeric:tabular-nums;min-width:36px}
</style></head>
<body><div class="card">
  <div class="row"><span class="lbl">2 space-1</span><div class="tick" style="width:2px;flex:none"></div><span class="val">2px</span></div>
  <div class="row"><span class="lbl">4 space-2</span><div class="tick" style="width:4px;flex:none"></div><span class="val">4px</span></div>
  <div class="row"><span class="lbl">8 space-4</span><div class="tick" style="width:8px;flex:none"></div><span class="val">8px</span></div>
  <div class="row"><span class="lbl">12 space-6</span><div class="tick" style="width:12px;flex:none"></div><span class="val">12px</span></div>
  <div class="row"><span class="lbl">16 space-8</span><div class="tick" style="width:16px;flex:none"></div><span class="val">16px</span></div>
  <div class="row"><span class="lbl">20 space-10</span><div class="tick" style="width:20px;flex:none"></div><span class="val">20px</span></div>
</div></body></html>
