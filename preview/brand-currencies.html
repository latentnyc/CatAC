<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:20px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .r{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}
  .ic{font-size:24px}
  .n{font-size:10px;color:#70748a;text-transform:uppercase;letter-spacing:.5px}
  .hx{font-size:10px;color:#a0a4b4;font-variant-numeric:tabular-nums}
  .g{color:#ffd866;font-weight:700;font-size:14px}
</style></head>
<body><div class="card">
  <div class="r"><div class="ic">💰</div><div class="g">1,240</div><div class="n">gold</div></div>
  <div class="r"><div class="ic">🐟</div><div class="g" style="color:#6ec6e8">42</div><div class="n">fishes</div></div>
  <div class="r"><div class="ic">🎀</div><div class="g" style="color:#e89cd2">7</div><div class="n">treaties</div></div>
  <div class="r"><div class="ic">🌀</div><div class="g" style="color:#b89ce8">13</div><div class="n">nine lives</div></div>
  <div class="r"><div class="ic">🐈</div><div class="g" style="color:#e6e6ea">12/16</div><div class="n">club</div></div>
</div></body></html>
