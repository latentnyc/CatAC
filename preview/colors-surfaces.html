<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans);font-size:14px}
  .card{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:4px;min-width:88px}
  .chip{height:44px;border-radius:8px;border:1px solid var(--cac-border)}
  .n{font-size:10px;color:var(--cac-text-muted);letter-spacing:.5px;text-transform:uppercase}
  .v{font-size:11px;color:var(--cac-text-dim);font-variant-numeric:tabular-nums}
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#14161c"></div><div class="n">bg</div><div class="v">#14161C</div></div>
    <div class="sw"><div class="chip" style="background:#1c1f29"></div><div class="n">panel</div><div class="v">#1C1F29</div></div>
    <div class="sw"><div class="chip" style="background:#242836"></div><div class="n">panel-2</div><div class="v">#242836</div></div>
    <div class="sw"><div class="chip" style="background:#12141c"></div><div class="n">inset</div><div class="v">#12141C</div></div>
    <div class="sw"><div class="chip" style="background:#2e3343"></div><div class="n">border</div><div class="v">#2E3343</div></div>
    <div class="sw"><div class="chip" style="background:#3a4057"></div><div class="n">border-strong</div><div class="v">#3A4057</div></div>
  </div>
</div></body></html>
