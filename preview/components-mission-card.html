<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:8px}
  .mission{background:#242836;border:1px solid #2e3343;border-radius:6px;padding:8px 10px}
  .row{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center}
  .tier{font-weight:700;font-size:14px;color:#ffd866}
  .dur{font-size:11px;color:#70748a;font-variant-numeric:tabular-nums}
  .stats{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#a0a4b4}
  .btn{background:#3a4057;color:#e6e6ea;border:none;padding:6px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:#ffd866;color:#2a2a2a}
  .locked{opacity:.5}
  .lock{font-size:11px;color:#70748a;font-style:italic;margin-top:4px}
</style></head>
<body><div class="card">
  <div class="mission"><div class="row">
    <div><div class="tier">T3</div><div class="dur">10m</div></div>
    <div class="stats"><span>DC 30</span><span>Party 1–3</span><span>30–75💰 · up to 2🐟 · 🎀 · 95 xp</span></div>
    <button class="btn">Plan</button>
  </div></div>
  <div class="mission locked"><div class="row">
    <div><div class="tier">T5</div><div class="dur">1h</div></div>
    <div class="stats"><span>DC 48</span><span>Party 1–3</span><span>200–500💰 · up to 5🐟 · 🎀 · 420 xp</span></div>
    <button class="btn" disabled>Plan</button>
  </div><div class="lock">Unlocks at 3000g total earned</div></div>
</div></body></html>
