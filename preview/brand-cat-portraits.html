<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:20px 22px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .cat{display:flex;flex-direction:column;gap:4px;align-items:center}
  canvas{background:radial-gradient(circle at 50% 55%,#2a2f42 0%,#1a1d29 100%);border:1px solid #2e3343;border-radius:8px}
  .n{font-size:10px;color:#70748a;text-transform:uppercase;letter-spacing:.5px}
  .l{font-size:11px;color:#a0a4b4}
</style></head>
<body><div class="card">
  <div class="cat"><canvas id="c1" width="108" height="108"></canvas><div class="l">Scrapper</div><div class="n">Maine Brawler</div></div>
  <div class="cat"><canvas id="c2" width="108" height="108"></canvas><div class="l">Mystic</div><div class="n">Whiskered Sage</div></div>
  <div class="cat"><canvas id="c3" width="108" height="108"></canvas><div class="l">Prowler</div><div class="n">Shadowpaw</div></div>
  <div class="cat"><canvas id="c4" width="108" height="108"></canvas><div class="l">Purrist</div><div class="n">Ragdoll Shepherd</div></div>
</div>
<script>
function drawCat(ctx,palette,icon,w,h){
  const cx=w/2,cy=h/2+8;
  ctx.strokeStyle=palette.fur;ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+22,cy+4);ctx.quadraticCurveTo(cx+44,cy-14,cx+48,cy-30);ctx.stroke();
  ctx.fillStyle=palette.fur;
  ctx.beginPath();ctx.ellipse(cx,cy+14,28,20,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=palette.fur;ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(cx-10,cy+26);ctx.lineTo(cx-10,cy+34);ctx.moveTo(cx+10,cy+26);ctx.lineTo(cx+10,cy+34);ctx.stroke();
  ctx.fillStyle=palette.fur;ctx.beginPath();ctx.ellipse(cx-10,cy+35,6,3,0,0,Math.PI*2);ctx.ellipse(cx+10,cy+35,6,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy-12,20,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-18,cy-22);ctx.lineTo(cx-8,cy-32);ctx.lineTo(cx-6,cy-18);ctx.closePath();
  ctx.moveTo(cx+18,cy-22);ctx.lineTo(cx+8,cy-32);ctx.lineTo(cx+6,cy-18);ctx.closePath();ctx.fill();
  ctx.fillStyle=palette.accent;ctx.beginPath();
  ctx.moveTo(cx-15,cy-22);ctx.lineTo(cx-10,cy-28);ctx.lineTo(cx-9,cy-20);ctx.closePath();
  ctx.moveTo(cx+15,cy-22);ctx.lineTo(cx+10,cy-28);ctx.lineTo(cx+9,cy-20);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(cx-7,cy-12,4,5,0,0,Math.PI*2);ctx.ellipse(cx+7,cy-12,4,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=palette.eyes;ctx.beginPath();ctx.ellipse(cx-7,cy-12,2.6,4.2,0,0,Math.PI*2);ctx.ellipse(cx+7,cy-12,2.6,4.2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(cx-7,cy-12,1,3.6,0,0,Math.PI*2);ctx.ellipse(cx+7,cy-12,1,3.6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#D97A8F';ctx.beginPath();ctx.moveTo(cx,cy-4);ctx.lineTo(cx-3,cy-1);ctx.lineTo(cx+3,cy-1);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(cx-10,cy-2);ctx.lineTo(cx-22,cy-4);ctx.moveTo(cx-10,cy+1);ctx.lineTo(cx-22,cy+2);
  ctx.moveTo(cx+10,cy-2);ctx.lineTo(cx+22,cy-4);ctx.moveTo(cx+10,cy+1);ctx.lineTo(cx+22,cy+2);ctx.stroke();
  ctx.fillStyle='#2a2a33';ctx.beginPath();ctx.arc(w-14,14,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd866';ctx.font='bold 14px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icon,w-14,14);
}
drawCat(document.getElementById('c1').getContext('2d'),{fur:'#C4956C',accent:'#8B6F47',eyes:'#4A9A5E'},'⚔',108,108);
drawCat(document.getElementById('c2').getContext('2d'),{fur:'#E8E2D5',accent:'#B8B0A0',eyes:'#7B3FBF'},'✿',108,108);
drawCat(document.getElementById('c3').getContext('2d'),{fur:'#3B3B42',accent:'#1F1F24',eyes:'#F7D84B'},'✶',108,108);
drawCat(document.getElementById('c4').getContext('2d'),{fur:'#F2E8DC',accent:'#5C4B3E',eyes:'#4A8AC7'},'✚',108,108);
</script></body></html>
