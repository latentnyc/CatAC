<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans)}
  .card{padding:24px 22px;display:flex;gap:18px;flex-wrap:wrap}
  .r{display:flex;flex-direction:column;gap:6px;align-items:center}
  .box{width:100px;height:56px;background:#1c1f29;border:1px solid #2e3343;border-radius:10px}
  .modal{box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .toast{box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .legend{border-color:#FFB347;box-shadow:0 0 12px rgba(255,179,71,.25)}
  .n{font-size:10px;color:#70748a;text-transform:uppercase;letter-spacing:.5px}
</style></head>
<body><div class="card">
  <div class="r"><div class="box"></div><div class="n">none</div></div>
  <div class="r"><div class="box toast"></div><div class="n">toast · 10/30</div></div>
  <div class="r"><div class="box modal"></div><div class="n">modal · 20/60</div></div>
  <div class="r"><div class="box legend"></div><div class="n">legendary glow</div></div>
</div></body></html>
