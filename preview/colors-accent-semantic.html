<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--cac-bg);color:var(--cac-text);font-family:var(--cac-font-sans);font-size:14px}
  .card{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
  .chip{height:44px;border-radius:8px;border:1px solid var(--cac-border)}
  .n{font-size:10px;color:var(--cac-text-muted);letter-spacing:.5px;text-transform:uppercase}
  .v{font-size:11px;color:var(--cac-text-dim);font-variant-numeric:tabular-nums}
  .brand{height:44px;border-radius:8px;background:linear-gradient(90deg,#ffd866,#ff9f68)}
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ffd866"></div><div class="n">accent</div><div class="v">#FFD866</div></div>
    <div class="sw"><div class="chip" style="background:#c9a94a"></div><div class="n">accent-dim</div><div class="v">#C9A94A</div></div>
    <div class="sw"><div class="chip" style="background:#ff9f68"></div><div class="n">accent-warm</div><div class="v">#FF9F68</div></div>
    <div class="sw"><div class="brand"></div><div class="n">brand gradient</div><div class="v">gold → coral</div></div>
    <div class="sw"><div class="chip" style="background:#4caf7d"></div><div class="n">success</div><div class="v">#4CAF7D</div></div>
    <div class="sw"><div class="chip" style="background:#d96c6c"></div><div class="n">danger</div><div class="v">#D96C6C</div></div>
  </div>
</div></body></html>
